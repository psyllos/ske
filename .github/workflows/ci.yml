name: SKE conformance
on: [push, pull_request]
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install pinned nightly MIR producer
        run: rustup toolchain install nightly-2026-10-15
        env:
          RUSTUP_MAX_RETRIES: "10"
      - name: Install system Z3 on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libz3-dev z3 pkg-config
      - name: Install system Z3 on macOS
        if: runner.os == 'macOS'
        run: brew install z3 pkg-config
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: adapters/go/go.sum
      - name: Install exact JDK 24.0.1
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)    jdk="OpenJDK24U-jdk_x64_linux_hotspot_24.0.1_9.tar.gz" ;;
            Linux-ARM64)  jdk="OpenJDK24U-jdk_aarch64_linux_hotspot_24.0.1_9.tar.gz" ;;
            macOS-X64)    jdk="OpenJDK24U-jdk_x64_mac_hotspot_24.0.1_9.tar.gz" ;;
            macOS-ARM64)  jdk="OpenJDK24U-jdk_aarch64_mac_hotspot_24.0.1_9.tar.gz" ;;
            *) echo "unsupported runner ${{ runner.os }}/${{ runner.arch }}"; exit 1 ;;
          esac
          url="https://github.com/adoptium/temurin24-binaries/releases/download/jdk-24.0.1%2B9/${jdk}"
          curl -fsSL -o "/tmp/jdk.tar.gz" "$url"
          mkdir -p "$RUNNER_TEMP/jdk"
          tar -xzf /tmp/jdk.tar.gz -C "$RUNNER_TEMP/jdk" --strip-components=1
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            echo "JAVA_HOME=$RUNNER_TEMP/jdk/Contents/Home" >> "$GITHUB_ENV"
            echo "$RUNNER_TEMP/jdk/Contents/Home/bin" >> "$GITHUB_PATH"
          else
            echo "JAVA_HOME=$RUNNER_TEMP/jdk" >> "$GITHUB_ENV"
            echo "$RUNNER_TEMP/jdk/bin" >> "$GITHUB_PATH"
          fi
      - name: Install exact Maven 3.10.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/maven.tar.gz \
            "https://archive.apache.org/dist/maven/maven-3/3.10.0/binaries/apache-maven-3.10.0-bin.tar.gz"
          mkdir -p "$RUNNER_TEMP/maven"
          tar -xzf /tmp/maven.tar.gz -C "$RUNNER_TEMP/maven" --strip-components=1
          echo "$RUNNER_TEMP/maven/bin" >> "$GITHUB_PATH"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Full conformance workflow
        run: ./scripts/verify.sh
