name: SKE conformance
on: [push, pull_request]
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install system Z3 on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libz3-dev z3 pkg-config
      - name: Install system Z3 on macOS
        if: runner.os == 'macOS'
        run: brew install z3 pkg-config
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: adapters/go/go.sum
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Full conformance workflow
        run: ./scripts/verify.sh
